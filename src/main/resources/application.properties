spring.application.name=spring-boot-demo

# DataSource
spring.datasource.url=jdbc:mysql://localhost:3306/spring_boot_demo?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate schema management
spring.jpa.hibernate.ddl-auto=update

# SQL logging (optional but handy)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Recommended in web apps to avoid lazy-load during view rendering
spring.jpa.open-in-view=false

# Dialect is usually auto-detected; uncomment if needed:
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
